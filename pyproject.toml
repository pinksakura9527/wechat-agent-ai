[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-agent-ai"
version = "0.1.0"
description = "Desktop AI agent that drives WeChat inside an Android emulator via llm-adb + MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WeChat Agent AI contributors" }]
keywords = ["wechat", "android", "adb", "llm", "agent", "mcp", "llm-adb", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment",
]
dependencies = [
  "PySide6-Essentials>=6.6",
  "mcp>=2.0",
  "openai>=1.40",
  "llm-adb>=0.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-qt>=4.4",
  "ruff>=0.6",
  "pyinstaller>=6.0",
]

[project.scripts]
wechat-agent = "app.main:main"

[project.urls]
Homepage = "https://github.com/pinksakura9527/wechat-agent-ai"
Issues = "https://github.com/pinksakura9527/wechat-agent-ai/issues"
"Architecture" = "https://github.com/pinksakura9527/wechat-agent-ai/blob/main/docs/architecture.md"

[tool.setuptools]
packages = ["app", "agent", "memory", "config"]

[tool.setuptools.package-data]
config = ["*.md", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: tests that need a real emulator (deselected by default)",
]
